[platformio]
src_dir = firmware/table_node
default_envs = esp01_1m

[env]
framework = arduino
monitor_speed = 115200
build_flags = -Wall

; ESP-01 / ESP-01S. Button on GPIO0 (to GND), LED on GPIO2 (LED + 330 ohm to 3V3, lights when pin is low).
; GPIO0 must not be held low at power-up or the module enters flash mode: do not press during boot.
[env:esp01_1m]
platform = espressif8266
board = esp01_1m
upload_speed = 115200
build_flags = ${env.build_flags} -DBUTTON_PIN=0 -DLED_PIN=2 -DLED_ACTIVE_LOW=1 -DBUZZER_PIN=-1

; NodeMCU / Wemos D1 mini style boards: button on D2 (GPIO4), buzzer on D5 (GPIO14),
; on-board LED on GPIO2 (active low).
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
build_flags = ${env.build_flags} -DBUTTON_PIN=4 -DLED_PIN=2 -DLED_ACTIVE_LOW=1 -DBUZZER_PIN=14

; ESP32 DevKit (WROOM): button GPIO4, LED GPIO2 (on-board, active high), buzzer GPIO27.
[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags = ${env.build_flags} -DBUTTON_PIN=4 -DLED_PIN=2 -DLED_ACTIVE_LOW=0 -DBUZZER_PIN=27

; ESP32-C3 (e.g. C3 SuperMini): button GPIO3, LED GPIO8 (on-board, active low), buzzer GPIO4.
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DBUTTON_PIN=3 -DLED_PIN=8 -DLED_ACTIVE_LOW=1 -DBUZZER_PIN=4
