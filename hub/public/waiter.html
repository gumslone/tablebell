<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waiter dashboard</title>
<link rel="stylesheet" href="common.css">
<style>
.stats{display:flex;gap:14px;font-size:13px;color:var(--mut);flex-wrap:wrap}.stats b{color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;padding:12px}
.card{border-radius:16px;padding:12px;background:var(--free);display:flex;flex-direction:column;gap:6px;min-height:126px;border:2px solid transparent;cursor:pointer;position:relative}
.card.occupied{background:var(--occ)}.card.call{background:var(--call);animation:pulse 1.2s infinite}.card.bill{background:var(--bill);color:#241500;animation:pulse 1.2s infinite}
.card.acked{background:var(--ack)}.card.ready{background:var(--ready)}.card.free{background:#1d2632;color:var(--mut)}
@keyframes pulse{50%{box-shadow:0 0 0 6px #ffffff22}}
.card .no{font-size:28px;font-weight:800;line-height:1}.card .what{font-weight:700}.card .tm{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700}
.card .sub{font-size:13px;opacity:.9}
.card .off{position:absolute;right:10px;top:10px;font-size:11px;background:#000a;color:#fff;padding:1px 7px;border-radius:99px}
.card .acts{display:flex;gap:6px;margin-top:auto}.card .acts button{flex:1;min-height:38px;padding:4px;background:#0006;color:inherit;font-weight:700}
.tabs{display:flex;gap:6px;padding:8px 12px 0}.tabs button{border-radius:10px}.tabs .on{background:var(--acc);color:#04111f;font-weight:700}
.ready{}
.rl{margin:8px 12px 0;padding:10px 12px;background:#12332f;border:1px solid var(--ready);border-radius:12px;font-size:14px}
.det h2{margin:0 0 4px}.det .it{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.det .it button{min-height:34px;padding:2px 10px;font-size:13px}
.mi{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.leg{display:flex;gap:8px;flex-wrap:wrap;padding:8px 12px;font-size:12px;color:var(--mut)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
</style></head>
<body>
<div class="top"><h1 id="rest">Waiter</h1><div class="stats" id="stats"></div><span class="sp"></span><span id="langs"></span><button id="snd" class="ghost">🔇</button></div>
<div class="tabs"><button class="on" id="tTables"></button><button id="tMenu"></button></div>
<div id="vTables"><div id="readyBox"></div><div class="grid" id="grid"></div>
<div class="leg" id="leg"></div></div>
<div id="vMenu" class="hidden"></div>
<div class="sheet hidden" id="sheet"><div class="det" id="det"></div></div>
<script src="common.js"></script>
<script>
let lastSig = '', S = null, sound = false, known = new Set(), open = null, adding = null;
const label = (st) => ({ call: tt('CALL'), bill: tt('BILL'), acked: tt('acked'), ready: tt('ready'), occupied: tt('occupied'), free: tt('free') }[st]);
const nm = (i) => lineName(S.menu, i.id, i.name);

async function poll() {
  let r;
  try { r = await Staff.get('/api/staff/state'); } catch { return; }
  if (r.status === 401) { if (!$('.sheet #pin')) pinGate(poll); return; }
  syncClock(r.json.now); const sig = JSON.stringify({ ...r.json, now: 0 }, (k, v) => (k === 'seen' ? undefined : v)); if (S && sig === lastSig) return; lastSig = sig; S = r.json; $('#rest').textContent = S.restaurant; draw();
  // Beep for every call that was not there before.
  const cur = new Set(S.tables.filter((t) => t.call && !t.call.ackAt).map((t) => t.t + ':' + t.call.type + ':' + t.call.since));
  if (sound && [...cur].some((k) => !known.has(k))) beep(3);
  known = cur;
}
const tableAge = (t) => t.call ? (nowMs() - t.call.since) / 1000 : 0;
function draw() {
  const st = S.stats, calls = S.tables.filter((t) => t.call).length;
  $('#stats').innerHTML = `<span>${esc(tt('openCalls'))} <b>${calls}</b></span><span>${esc(tt('avgResp'))} <b>${st.avgResponseSec == null ? '–' : dur(st.avgResponseSec)}</b></span><span>${esc(tt('salesToday'))} <b>${money(st.salesToday, S.currency)}</b> (${st.tablesPaid} ${esc(tt('nTables'))})</span>`;
  const ready = S.tables.flatMap((t) => t.orders.flatMap((o) => o.items.filter((i) => i.st === 'ready').map((i) => ({ t: t.t, i }))));
  $('#readyBox').innerHTML = ready.length ? `<div class="rl">${esc(tt('readyServe'))} ${ready.map((r) => `<b>T${r.t}</b> ${r.i.qty}× ${esc(nm(r.i))}`).join(' · ')}</div>` : '';
  const prio = { call: 0, bill: 1, acked: 2, ready: 3, occupied: 4, free: 5 };
  const tables = [...S.tables].sort((a, b) => prio[a.status] - prio[b.status] || (a.call ? a.call.since - b.call.since : a.t - b.t));
  $('#grid').innerHTML = tables.map((t) => {
    const c = t.call, open = t.orders.some((o) => o.items.some((i) => i.st === 'held'));
    return `<div class="card ${t.status}" data-t="${t.t}">
      ${t.node && !t.node.online ? `<span class="off">${esc(tt('btnOffline'))}</span>` : ''}
      <div class="no">${t.t}</div><div class="what">${esc(label(t.status))}${t.payReq ? ' · ' + tt(t.payReq) : ''}</div>
      ${c ? `<div class="tm" data-since="${c.since}">${dur(tableAge(t))}</div>` : ''}
      <div class="sub">${t.total ? money(t.total, S.currency) : ''}${open ? ' · ' + tt('needsConfirm') : ''}</div>
      <div class="acts">${c && !c.ackAt ? `<button data-a="ack">${esc(tt('coming'))}</button>` : ''}${c && c.ackAt ? `<button data-a="clear">${esc(tt('done'))}</button>` : ''}${t.status === 'bill' || (c && c.type === 'bill' && c.ackAt) || t.payReq ? `<button data-a="paid">${esc(tt('paid'))}</button>` : ''}</div></div>`;
  }).join('');
  $('#grid').querySelectorAll('.card').forEach((el) => {
    el.onclick = (e) => {
      const a = e.target.dataset.a, t = Number(el.dataset.t);
      if (a) { e.stopPropagation(); act(a, t); } else { open = t; drawSheet(); }
    };
  });
  if (open) drawSheet(true);
  if (!$('#vMenu').classList.contains('hidden')) drawMenu();
}
async function act(a, t) {
  if (a === 'paid' && !confirm(`${tt('table')} ${t} ${tt('confirmPaid')}`)) return;
  const r = await Staff.post('/api/staff/' + a, { t }); if (r.ok) { S = r.json.state; draw(); }
}
function drawSheet(keep) {
  const t = S.tables.find((x) => x.t === open); if (!t) return;
  if (keep && adding) return; // don't redraw underneath an open add-item picker
  $('#sheet').classList.remove('hidden');
  const its = t.orders.map((o) => `<div class="mut" style="margin-top:8px;font-size:12px">${esc(tt('order'))} #${o.id} · ${esc(tt(o.by === 'guest' ? 'guest' : 'waiterBy'))}${o.note ? ' · “' + esc(o.note) + '”' : ''}${o.items.some((i) => i.st === 'held') ? ` <button data-conf="${o.id}" class="warn" style="min-height:30px">${esc(tt('confirm'))}</button>` : ''}</div>` +
    o.items.map((i, idx) => `<div class="it"><span class="sp">${i.qty}× ${esc(nm(i))}</span><span class="st-${i.st}">${esc(tt('s_' + i.st))}</span>${i.st !== 'cancelled' ? `<button class="ghost" data-q="${o.id}:${idx}:${i.qty - 1}">−</button><button class="ghost" data-q="${o.id}:${idx}:${i.qty + 1}">+</button>` : ''}${i.st === 'ready' ? `<button class="ok" data-o="${o.id}" data-i="${idx}">${esc(tt('served'))}</button>` : ''}${i.st !== 'cancelled' && i.st !== 'served' && i.st !== 'ready' ? `<button class="ghost" data-o="${o.id}" data-i="${idx}" data-to="cancelled">✕</button>` : ''}</div>`).join('')).join('');
  $('#det').innerHTML = `<div class="row"><h2 class="sp">${esc(tt('table'))} ${t.t}</h2><button class="ghost" id="xc">${esc(tt('close'))}</button></div>
    <div class="mut" style="font-size:13px">${t.node ? (t.node.online ? `${tt('btnOnline')} · ${t.node.rssi} dBm · ${t.node.vcc.toFixed ? t.node.vcc.toFixed(2) : t.node.vcc} V` : tt('btnOff')) : tt('noNode')} · ${esc(tt('guestKey'))} <code>${esc(t.key)}</code></div>
    ${its || `<p class="mut">${esc(tt('noOrders'))}</p>`}
    <div class="line row" style="margin-top:10px;font-weight:700"><span class="sp">${esc(tt('total'))}</span><span>${money(t.total, S.currency)}</span></div>
    <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="pri" id="ad">${esc(tt('addItems'))}</button><button class="warn" id="fc">${esc(tt('flagCall'))}</button><button class="warn" id="fb">${esc(tt('flagBill'))}</button><button class="ok" id="pd">${esc(tt('paid'))}</button></div>`;
  $('#xc').onclick = () => { open = null; adding = null; $('#sheet').classList.add('hidden'); };
  $('#fc').onclick = () => act('call', t.t); $('#fb').onclick = async () => { const r = await Staff.post('/api/staff/call', { t: t.t, type: 'bill' }); if (r.ok) { S = r.json.state; draw(); } };
  $('#pd').onclick = async () => { await act('paid', t.t); open = null; $('#sheet').classList.add('hidden'); };
  $('#ad').onclick = () => addPicker(t);
  $('#det').querySelectorAll('[data-conf]').forEach((b) => { b.onclick = async () => { const r = await Staff.post('/api/staff/confirm', { oid: Number(b.dataset.conf) }); if (r.ok) { S = r.json.state; draw(); } }; });
  $('#det').querySelectorAll('[data-q]').forEach((b) => { b.onclick = async () => { const [oid, idx, qty] = b.dataset.q.split(':').map(Number); const r = await Staff.post('/api/staff/qty', { oid, idx, qty: Math.min(20, qty) }); if (r.ok) { S = r.json.state; draw(); } }; });
  $('#det').querySelectorAll('[data-o]').forEach((b) => { b.onclick = async () => { const r = await Staff.post('/api/staff/item', { oid: Number(b.dataset.o), idx: Number(b.dataset.i), to: b.dataset.to }); if (r.ok) { S = r.json.state; draw(); } }; });
}
function addPicker(t) {
  adding = {};
  const render = () => {
    $('#det').innerHTML = `<div class="row"><h2 class="sp">${esc(tt('addTo'))} ${t.t}</h2><button class="ghost" id="ab">${esc(tt('back'))}</button></div>` +
      S.menu.filter((m) => m.avail).map((m) => `<div class="mi"><span class="sp">${esc(mItem(m).name)} <span class="mut">${money(m.price, S.currency)}</span></span><button data-m="${m.id}" class="ghost">−</button><b>${adding[m.id] || 0}</b><button data-p="${m.id}">+</button></div>`).join('') +
      `<button class="pri" id="as" style="width:100%;margin-top:12px">${esc(tt('sendKb'))}</button>`;
    $('#ab').onclick = () => { adding = null; drawSheet(); };
    $('#det').querySelectorAll('[data-p]').forEach((b) => { b.onclick = () => { adding[b.dataset.p] = (adding[b.dataset.p] || 0) + 1; render(); }; });
    $('#det').querySelectorAll('[data-m]').forEach((b) => { b.onclick = () => { if (adding[b.dataset.m] > 0) adding[b.dataset.m]--; render(); }; });
    $('#as').onclick = async () => {
      const items = Object.entries(adding).filter(([, q]) => q > 0).map(([id, qty]) => ({ id, qty }));
      if (!items.length) return;
      const r = await Staff.post('/api/staff/order', { t: t.t, items }); if (r.ok) { S = r.json.state; adding = null; draw(); drawSheet(); } else toast(tt('sendFail'));
    };
  };
  render();
}
function drawMenu() {
  $('#vMenu').innerHTML = S.menu.map((m) => `<div class="mi"><span class="sp">${esc(mItem(m).name)} <span class="mut">${esc(tt(m.station))}</span></span><span class="pill" style="background:${m.avail ? 'var(--ok)' : 'var(--call)'};color:#fff">${esc(m.avail ? tt('available') : tt('soldOut'))}</span><button data-id="${m.id}" data-av="${m.avail ? 0 : 1}">${esc(m.avail ? tt('markSold') : tt('markAvail'))}</button></div>`).join('');
  $('#vMenu').querySelectorAll('button').forEach((b) => { b.onclick = async () => { const r = await Staff.post('/api/staff/avail', { id: b.dataset.id, avail: b.dataset.av === '1' }); if (r.ok) { S = r.json.state; draw(); } }; });
}
$('#snd').onclick = () => { sound = !sound; setSnd(); if (sound) beep(1); };
$('#tTables').onclick = () => { $('#vTables').classList.remove('hidden'); $('#vMenu').classList.add('hidden'); $('#tTables').classList.add('on'); $('#tMenu').classList.remove('on'); };
$('#tMenu').onclick = () => { $('#vMenu').classList.remove('hidden'); $('#vTables').classList.add('hidden'); $('#tMenu').classList.add('on'); $('#tTables').classList.remove('on'); if (S) drawMenu(); };
function setSnd() { $('#snd').textContent = tt(sound ? 'soundOn' : 'soundOff'); }
function statics() {
  $('#tTables').textContent = tt('tables'); $('#tMenu').textContent = tt('menuAvail'); setSnd();
  $('#leg').innerHTML = [['call', 'lCall'], ['bill', 'lBill'], ['ack', 'lAcked'], ['ready', 'lReady'], ['occ', 'lSeated']].map(([c, k]) => `<span><i style="background:var(--${c})"></i>${esc(tt(k))}</span>`).join('') + `<span><i style="background:#1d2632"></i>${esc(tt('lFree'))}</span>`;
}
statics(); langSwitch(() => { statics(); if (S) draw(); });
poll(); setInterval(poll, 1500);
setInterval(() => { document.querySelectorAll('[data-since]').forEach((e) => { e.textContent = dur((nowMs() - Number(e.dataset.since)) / 1000); }); }, 1000);
</script></body></html>
